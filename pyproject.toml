[project]
name = "nebumtk-unlock-tools"
version = "1.1.0"
description = "NEBUMTK Bootloader unlock tool for MediaTek v6 devices (open source)"
license = { text = "AGPL-3.0-only" }
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.10.2",
    "PyYAML==6.0.3",
    "cryptography==48.0.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.2",
]

[project.scripts]
nebumtk = "nebumtk_unlock_tools.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nebumtk_unlock_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["workspace", "dist", "dist-win", "local-dev"]
